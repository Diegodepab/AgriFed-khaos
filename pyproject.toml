[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrifed-khaos"
version = "0.1.0"
description = "Federated learning scaffold for agricultural computer vision workloads"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.11",
  "pydantic-settings>=2.8",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
vision = [
  "opencv-python-headless>=4.10",
  "torch>=2.4",
  "torchvision>=0.19",
  "timm>=1.0",
  "ultralytics>=8.3",
]
fl = [
  "flwr>=1.13",
  "torch>=2.4",
  "torchvision>=0.19",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]
serve = [
  "fastapi>=0.110",
  "uvicorn>=0.28",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.scripts]
agrifed-audit = "agrifed_khaos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["yaml", "cv2", "cv2.*", "timm", "timm.*", "ultralytics", "ultralytics.*", "flwr", "flwr.*", "torchvision", "torchvision.*"]
ignore_missing_imports = true
