services:
  agrifed:
    build:
      context: .
      args:
        PROJECT_EXTRAS: ${AGRIFED_PROJECT_EXTRAS:-vision,fl,dev,serve,eval}
        USER_UID: ${AGRIFED_UID:-1001}
        USER_GID: ${AGRIFED_GID:-1001}
    image: agrifed-khaos:latest
    working_dir: /workspace
    shm_size: 2gb
    user: "${AGRIFED_UID:-1001}:${AGRIFED_GID:-1001}"
    tty: true
    stdin_open: true
    environment:
      AGRIFED_CONFIG_PATH: /workspace/configs/federated.yaml
      HOME: /tmp/agrifed-home
      XDG_CACHE_HOME: /tmp/agrifed-cache
      PYTHONPATH: /workspace/src
      RUFF_CACHE_DIR: /tmp/ruff_cache
      MYPY_CACHE_DIR: /tmp/mypy_cache
      PYTEST_ADDOPTS: "-o cache_dir=/tmp/pytest_cache"
      AGRIFED_AUTH_TOKEN: ${AGRIFED_AUTH_TOKEN:-}
      AGRIFED_HMAC_KEY: ${AGRIFED_HMAC_KEY:-}
    volumes:
      - .:/workspace
      - ${AGRIFED_DATASET_ROOT:-../enfermedadeshoja_v1.0/EnfermedadesHoja_v1.0}:/data/EnfermedadesHoja_v1.0:ro
    ports:
      - "8000:8000"
      - "8080:8080"
    command: ["sleep", "infinity"]
