<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50/50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Restringido &bull; KHAOS Hub Data Space</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/khaos-bundle.min.css">
  <link rel="stylesheet" href="/static/khaos-ui.css">
  <script src="/static/khaos-ui.js" defer></script>
</head>
<body class="min-h-full flex flex-col font-sans text-slate-900 antialiased bg-slate-50">

  <!-- Header -->
  <header class="w-full border-b border-slate-200/70 bg-white/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5">
        <picture>
          <source srcset="/static/logo.webp" type="image/webp">
          <img src="/static/logo.png" alt="KHAOS Logo" width="32" height="32" class="h-8 w-8 rounded-lg object-contain" />
        </picture>
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold tracking-tight text-slate-900">KHAOS <span class="text-slate-600 font-normal">Hub</span></span>
          <span class="text-[10px] font-medium px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 ring-1 ring-inset ring-slate-500/10 uppercase tracking-wider">Data Space</span>
        </div>
      </a>

      <div class="flex items-center gap-2">
        <a href="/" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors">
          <span>Ir a Modelos</span>
          <span class="text-slate-400">&rarr;</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Access Denied Card -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-lg bg-white rounded-3xl border border-slate-200/80 shadow-xl p-6 sm:p-8 space-y-6 text-center">
      
      <div class="w-14 h-14 rounded-2xl bg-amber-50 border border-amber-200 flex items-center justify-center mx-auto text-amber-600">
        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>

      <div class="space-y-2">
        <span class="px-2.5 py-0.5 rounded-md text-[11px] font-bold uppercase tracking-wider bg-amber-100 text-amber-800">
          HTTP 403 &bull; Permiso Insuficiente
        </span>
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Acceso Restringido</h1>
        <p class="text-xs sm:text-sm text-slate-600 leading-relaxed max-w-md mx-auto">
          {{REASON_MESSAGE}}
        </p>
      </div>

      <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200/80 text-xs text-left space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-slate-500">Sesión actual:</span>
          <span class="font-mono font-bold text-slate-900">{{CURRENT_USER_LABEL}}</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-slate-500">Rol asignado:</span>
          <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider {{ROLE_BADGE_CLASS}}">{{CURRENT_ROLE_LABEL}}</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-slate-500">Permiso requerido:</span>
          <span class="font-semibold text-slate-800">{{REQUIRED_ROLES_LABEL}}</span>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
        <a href="/" class="w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-800 bg-slate-100 hover:bg-slate-200 transition-colors text-center">
          Ir al Catálogo de Modelos
        </a>
        <a href="/login?next={{NEXT_URL}}" class="w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs font-semibold text-white bg-slate-900 hover:bg-slate-800 transition-colors text-center">
          Cambiar de Cuenta / Iniciar Sesión &rarr;
        </a>
      </div>

    </div>
  </main>
</body>
</html>
