<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50/50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso a la Plataforma &bull; KHAOS Hub</title>
  <meta name="description" content="Acceso y registro en la plataforma de visión artificial KHAOS Hub">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/khaos-bundle.min.css">
  <link rel="stylesheet" href="/static/khaos-ui.css">
  <script src="/static/khaos-ui.js" defer></script>
</head>
<body class="min-h-full flex flex-col font-sans text-slate-900 antialiased bg-slate-50">

  <!-- Minimal Brand Header -->
  <header class="w-full border-b border-slate-200/70 bg-white/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5 group">
        <picture>
          <source srcset="/static/logo.webp" type="image/webp">
          <img src="/static/logo.png" alt="KHAOS Logo" width="32" height="32" class="h-8 w-8 rounded-lg object-contain group-hover:scale-105 transition-transform" />
        </picture>
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold tracking-tight text-slate-900">KHAOS <span class="text-slate-600 font-normal">Hub</span></span>
          <span class="text-[10px] font-medium px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 ring-1 ring-inset ring-slate-500/10 uppercase tracking-wider">Data Space</span>
        </div>
      </a>

      <div class="flex items-center gap-2">
        <a href="/" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors">
          <svg class="w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          <span>Volver al Catálogo</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Auth Card Center Container -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-md space-y-4">

      <!-- Authentication Box -->
      <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xl shadow-slate-200/40 p-6 sm:p-8 space-y-6">
        
        <!-- Heading -->
        <div class="text-center space-y-1">
          <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight" id="authTitle">
            Iniciar Sesión
          </h1>
          <p class="text-xs text-slate-500" id="authSubtitle">
            Introduce tus credenciales para acceder a la plataforma.
          </p>
        </div>

        <!-- Tab Switcher: Iniciar Sesión / Crear Cuenta -->
        <div class="grid grid-cols-2 p-1 bg-slate-100 rounded-xl gap-1 text-xs font-semibold">
          <button
            type="button"
            id="tabBtnLogin"
            onclick="switchAuthTab('login')"
            class="py-2 px-3 rounded-lg text-slate-900 bg-white shadow-xs transition-all cursor-pointer text-center"
          >
            Iniciar Sesión
          </button>
          <button
            type="button"
            id="tabBtnRegister"
            onclick="switchAuthTab('register')"
            class="py-2 px-3 rounded-lg text-slate-600 hover:text-slate-900 transition-all cursor-pointer text-center"
          >
            Crear Cuenta
          </button>
        </div>

        <!-- Feedback Alert Container -->
        <div id="authAlertBox" class="hidden rounded-xl border p-3 text-xs flex items-start gap-2">
          <svg id="authAlertIcon" class="w-4 h-4 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <div id="authAlertMsg" class="leading-relaxed"></div>
        </div>

        <!-- 1. LOGIN FORM -->
        <form id="formLogin" onsubmit="handleLoginSubmit(event)" class="space-y-4">
          <div>
            <label for="loginUsername" class="block text-xs font-semibold text-slate-700 mb-1">
              Usuario o correo electrónico
            </label>
            <input
              type="text"
              id="loginUsername"
              required
              autocomplete="username"
              placeholder="tu_usuario o correo@empresa.com"
              class="w-full rounded-xl border border-slate-200 bg-slate-50/60 focus:bg-white px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 transition-all placeholder:text-slate-400 font-mono"
            >
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <label for="loginPassword" class="block text-xs font-semibold text-slate-700">
                Contraseña
              </label>
              <button
                type="button"
                onclick="togglePasswordVisibility('loginPassword', 'btnToggleLoginPwd')"
                class="text-[11px] font-medium text-slate-500 hover:text-slate-900 cursor-pointer"
                id="btnToggleLoginPwd"
              >
                Mostrar
              </button>
            </div>
            <input
              type="password"
              id="loginPassword"
              required
              autocomplete="current-password"
              placeholder="Introduce tu contraseña..."
              class="w-full rounded-xl border border-slate-200 bg-slate-50/60 focus:bg-white px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 transition-all placeholder:text-slate-400"
            >
          </div>

          <button
            type="submit"
            id="btnLoginSubmit"
            class="w-full py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold text-white bg-slate-900 hover:bg-slate-800 active:scale-[0.99] transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer"
          >
            <span>Iniciar Sesión</span>
            <span class="text-slate-400">&rarr;</span>
          </button>
        </form>

        <!-- 2. REGISTER FORM -->
        <form id="formRegister" onsubmit="handleRegisterSubmit(event)" class="hidden space-y-3.5">
          <div>
            <label for="regFullName" class="block text-xs font-semibold text-slate-700 mb-1">
              Nombre completo
            </label>
            <input
              type="text"
              id="regFullName"
              required
              minlength="2"
              placeholder="ej. Dra. Elena Gómez"
              class="w-full rounded-xl border border-slate-200 bg-slate-50/60 focus:bg-white px-3.5 py-2 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 transition-all placeholder:text-slate-400"
            >
          </div>

          <div>
            <label for="regUsername" class="block text-xs font-semibold text-slate-700 mb-1">
              Nombre de usuario
            </label>
            <input
              type="text"
              id="regUsername"
              required
              minlength="3"
              maxlength="32"
              placeholder="ej. elenagomez"
              class="w-full rounded-xl border border-slate-200 bg-slate-50/60 focus:bg-white px-3.5 py-2 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 transition-all placeholder:text-slate-400 font-mono"
            >
          </div>

          <div>
            <label for="regEmail" class="block text-xs font-semibold text-slate-700 mb-1">
              Correo electrónico
            </label>
            <input
              type="email"
              id="regEmail"
              required
              placeholder="ej. elena@olivar.es"
              class="w-full rounded-xl border border-slate-200 bg-slate-50/60 focus:bg-white px-3.5 py-2 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 transition-all placeholder:text-slate-400"
            >
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <label for="regPassword" class="block text-xs font-semibold text-slate-700">
                Contraseña
              </label>
              <button
                type="button"
                onclick="togglePasswordVisibility('regPassword', 'btnToggleRegPwd')"
                class="text-[11px] font-medium text-slate-500 hover:text-slate-900 cursor-pointer"
                id="btnToggleRegPwd"
              >
                Mostrar
              </button>
            </div>
            <input
              type="password"
              id="regPassword"
              required
              minlength="6"
              placeholder="Mínimo 6 caracteres..."
              class="w-full rounded-xl border border-slate-200 bg-slate-50/60 focus:bg-white px-3.5 py-2 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 transition-all placeholder:text-slate-400"
            >
          </div>

          <div>
            <label for="regPasswordConfirm" class="block text-xs font-semibold text-slate-700 mb-1">
              Confirmar contraseña
            </label>
            <input
              type="password"
              id="regPasswordConfirm"
              required
              minlength="6"
              placeholder="Repite la contraseña..."
              class="w-full rounded-xl border border-slate-200 bg-slate-50/60 focus:bg-white px-3.5 py-2 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 transition-all placeholder:text-slate-400"
            >
          </div>

          <button
            type="submit"
            id="btnRegSubmit"
            class="w-full py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold text-white bg-slate-900 hover:bg-slate-800 active:scale-[0.99] transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer mt-2"
          >
            <span>Crear Cuenta</span>
            <span class="text-slate-400">&rarr;</span>
          </button>
        </form>

        <!-- Guest link -->
        <div class="pt-3 border-t border-slate-100 text-center">
          <p class="text-xs text-slate-500">
            ¿Solo deseas explorar y probar modelos?
            <a href="/" class="font-semibold text-slate-900 hover:underline ml-1">
              Continuar como Invitado &rarr;
            </a>
          </p>
        </div>

      </div>

    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const nextUrl = urlParams.get('next');
    if (urlParams.get('tab') === 'register') {
      switchAuthTab('register');
    }

    function switchAuthTab(tab) {
      const isLogin = tab === 'login';
      const formLogin = document.getElementById('formLogin');
      const formRegister = document.getElementById('formRegister');
      const tabBtnLogin = document.getElementById('tabBtnLogin');
      const tabBtnRegister = document.getElementById('tabBtnRegister');
      const authTitle = document.getElementById('authTitle');
      const authSubtitle = document.getElementById('authSubtitle');
      const alertBox = document.getElementById('authAlertBox');

      if (alertBox) alertBox.classList.add('hidden');

      if (isLogin) {
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
        tabBtnLogin.className = 'py-2 px-3 rounded-lg text-slate-900 bg-white shadow-xs transition-all cursor-pointer text-center';
        tabBtnRegister.className = 'py-2 px-3 rounded-lg text-slate-600 hover:text-slate-900 transition-all cursor-pointer text-center';
        authTitle.textContent = 'Iniciar Sesión';
        authSubtitle.textContent = 'Introduce tus credenciales para acceder a la plataforma.';
      } else {
        formLogin.classList.add('hidden');
        formRegister.classList.remove('hidden');
        tabBtnRegister.className = 'py-2 px-3 rounded-lg text-slate-900 bg-white shadow-xs transition-all cursor-pointer text-center';
        tabBtnLogin.className = 'py-2 px-3 rounded-lg text-slate-600 hover:text-slate-900 transition-all cursor-pointer text-center';
        authTitle.textContent = 'Crear Cuenta';
        authSubtitle.textContent = 'Regístrate para solicitar acceso a la plataforma.';
      }
    }

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('authAlertBox');
      const txt = document.getElementById('authAlertMsg');
      if (!box || !txt) return;
      txt.textContent = msg;
      if (isSuccess) {
        box.className = 'rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-xs text-emerald-800 flex items-start gap-2';
      } else {
        box.className = 'rounded-xl border border-rose-200 bg-rose-50 p-3 text-xs text-rose-700 flex items-start gap-2';
      }
      box.classList.remove('hidden');
    }

    function togglePasswordVisibility(inputId, btnId) {
      const p = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (!p || !btn) return;
      if (p.type === 'password') {
        p.type = 'text';
        btn.textContent = 'Ocultar';
      } else {
        p.type = 'password';
        btn.textContent = 'Mostrar';
      }
    }

    async function handleLoginSubmit(ev) {
      ev.preventDefault();
      const u = document.getElementById('loginUsername').value.trim();
      const p = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnLoginSubmit');
      if (!u || !p) return;

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span>Verificando...</span>';
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p }),
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Usuario o contraseña incorrectos.');
        }

        const role = data.user ? data.user.role : 'user';
        let destination = nextUrl;
        if (!destination || destination === '/login') {
          if (role === 'admin') destination = '/master';
          else if (role === 'expert') destination = '/expert';
          else destination = '/';
        }

        if (window.KhaosUI && KhaosUI.toast) {
          KhaosUI.toast(`¡Bienvenido @${data.user.username}!`, 'success', 2500);
        }
        window.location.href = destination;
      } catch (err) {
        showAlert(err.message, false);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<span>Iniciar Sesión</span><span class="text-slate-400">&rarr;</span>';
        }
      }
    }

    async function handleRegisterSubmit(ev) {
      ev.preventDefault();
      const fullName = document.getElementById('regFullName').value.trim();
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPwd = document.getElementById('regPasswordConfirm').value;
      const btn = document.getElementById('btnRegSubmit');

      if (password !== confirmPwd) {
        showAlert('Las contraseñas no coinciden. Por favor, verifícalas.', false);
        return;
      }

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span>Registrando cuenta...</span>';
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: fullName,
            username: username,
            email: email,
            password: password,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Error al registrar la cuenta.');
        }

        showAlert(data.message || 'Cuenta registrada exitosamente.', true);
        document.getElementById('formRegister').reset();
        setTimeout(() => {
          switchAuthTab('login');
          document.getElementById('loginUsername').value = username;
        }, 3000);
      } catch (err) {
        showAlert(err.message, false);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<span>Crear Cuenta</span><span class="text-slate-400">&rarr;</span>';
        }
      }
    }
  </script>
</body>
</html>
